<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Statistiques | SportFlow</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b09;
            color: white;
        }

        nav {
            height: 75px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 7%;

            background: #111512;

            border-bottom: 1px solid #292f2a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #8bdc28;
        }

        .back {
            color: #8bdc28;
            text-decoration: none;
            font-size: 13px;
        }

        .container {
            padding: 55px 7%;
        }

        .title {
            margin-bottom: 35px;
        }

        .title p {
            color: #8bdc28;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .title h1 {
            font-size: 35px;
            margin-top: 10px;
        }

        .title span {
            color: #8bdc28;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat {
            background: #151916;
            border: 1px solid #292f2a;
            border-radius: 12px;
            padding: 30px 25px;
            text-align: center;
        }

        .stat:hover {
            border-color: #8bdc28;
        }

        .number {
            color: #8bdc28;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .label {
            color: #aaa;
            font-size: 13px;
        }

        @media(max-width: 800px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media(max-width: 550px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            ⚽ Sport<span>Flow</span>
        </div>

        <a href="{% url 'homa' %}" class="back">
            ← Accueil
        </a>

    </nav>


    <main class="container">

        <div class="title">

            <p>SPORTFLOW</p>

            <h1>
                Nos <span>statistiques</span>
            </h1>

        </div>


        <div class="stats">

            <div class="stat">

                <div class="number">
                    {{ nombre_clubs }}
                </div>

                <div class="label">
                    Clubs
                </div>

            </div>


            <div class="stat">

                <div class="number">
                    {{ nombre_terrains }}
                </div>

                <div class="label">
                    Terrains
                </div>

            </div>


            <div class="stat">

                <div class="number">
                    {{ nombre_equipements }}
                </div>

                <div class="label">
                    Équipements
                </div>

            </div>


            <div class="stat">

                <div class="number">
                    {{ nombre_projets }}
                </div>

                <div class="label">
                    Projets sportifs
                </div>

            </div>

        </div>

    </main>

</body>

</html>
